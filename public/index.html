<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crate — listening library</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    // Theme boot: saved choice, else OS preference; ?theme= overrides for review.
    (function () {
      var t = new URLSearchParams(location.search).get('theme');
      try { t = t || localStorage.getItem('crate-theme'); } catch (e) {}
      document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    })();
  </script>
  <link rel="preload" href="/fonts/bricolage-grotesque-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/components.css">
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { mountLibrary } from '/js/library-view.js';
    import { createApiStore } from '/js/api-store.js';
    mountLibrary(document.getElementById('root'), { store: createApiStore() });
  </script>
</body>
</html>
